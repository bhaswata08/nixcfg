# Noctalia v5 Configuration
#
# Note: GUI changes made in Settings land in ~/.local/state/noctalia/settings.toml,
# which overrides this file. If Time Blocks stops updating or disappears, delete
# the [plugins] section of settings.toml.
#
# Dropped v4 settings with no v5 equivalent:
# - bar.density = "compact": v5 controls layout through thickness, padding, widget_spacing, scale, and font_scale.
# - bar.frameThickness, bar.useSeparateOpacity, bar.outerCorners, bar.enableExclusionZoneInset: replaced by native bar geometry (thickness, margin_edge, margin_ends, radius).
# - bar.widgets.left.ActiveWindow (maxWidth, scrollingMode, useFixedWidth, textColor): replaced by min_length, max_length, title_scroll, and display = "icon_only".
# - bar.widgets.right.SystemMonitor multi-stat display in a single widget: v5 sysmon displays one stat per widget; multiple named widget instances (sysmon, temp, ram) are placed on the bar instead.
# - bar.widgets.right.Volume/Bluetooth/Brightness displayMode = "onhover": v5 widgets do not have an on-hover label display mode.
# - bar.widgets.right.Battery (showNoctaliaPerformance, showPowerProfiles): not embedded directly in the v5 battery widget.
# - bar.widgets.right.ControlCenter (icon = "noctalia"): v5 control-center widget uses glyph = "noctalia" by default.
# - ui.panelBackgroundOpacity = 0.25: v5 replaces numeric panel opacity with discrete transparency_mode ("solid", "soft", "glass") under [shell.panel]; set to "glass".
# - Session menu card opacity overrideAttrs patch: v5 session panel does not expose an opacity configuration setting.
# - general.clockStyle = "custom", general.dimmerOpacity: lockscreen / general styling reworked in v5.
# - general.enableLockScreenCountdown, lockScreenCountdownDuration: v5 session lock does not use a separate lockscreen countdown; 10s countdown is configured per action under [shell.session.actions].

[bar]
order = ["main"]

[bar.main]
position = "top"
background_opacity = 0.0
capsule = true
capsule_opacity = 0.55
thickness = 25
margin_edge = 4
margin_ends = 4
radius = 12
padding = 0
widget_spacing = 6
font_scale = 0.92

start = ["workspaces", "audio_visualizer"]
center = ["clock", "timeblock"]
end = [
  "sysmon",
  "temp",
  "ram",
  "tray",
  "bluetooth",
  "notifications",
  "battery",
  "volume",
  "brightness",
  "control-center",
]

[widget.clock]
format = "{:%I:%M %p %a, %b %d}"
font_family = "IosevkaTerm NFP Medium"
capsule_padding = 10

[widget.timeblock]
type = "bhaswata/timeblock:bar"

[widget.volume.actions]
middle = "exec pwvucontrol || pavucontrol"

[widget.workspaces]
label_source = "id"
hide_when_empty = true
focused_color = "error"
style = "focus_hint"
active_pill_size = 2.0
inactive_pill_size = 1.2

[widget.sysmon]
stat = "cpu_usage"
show_value = false

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
show_value = false

[widget.ram]
type = "sysmon"
stat = "ram_used"
show_value = false

[widget.active_window]
display = "icon_only"
min_length = 0

[widget.audio_visualizer]
color_2 = "secondary"

[widget.tray]
drawer = true
hide_passive = false

[widget.battery]
display_mode = "graphic"

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Kanagawa"
wallpaper_scheme = "faithful"
sync_color_scheme = true

[theme.templates.user.rofi]
input_path = "@rofiColorsTemplate@"
output_path = "~/.config/rofi/colors.rasi"

[wallpaper]
enabled = true
directory = "/home/bhaswata/dotfiles/nixcfg/configs/theming/wallpapers"
transition_on_startup = true

[wallpaper.default]
path = "/home/bhaswata/dotfiles/nixcfg/configs/theming/wallpapers/bg-8.png"

[wallpaper.automation]
enabled = true

[lockscreen]
enabled = true
lock_before_suspend = true

[notification]
position = "top_right"

[shell]
avatar_path = "~/.face"
launch_apps_as_systemd_services = true

[shell.panel]
transparency_mode = "glass"
launcher_placement = "attached"
clipboard_placement = "attached"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[shell.session]
show_shortcuts = true

[[shell.session.actions]]
action = "lock"
shortcut = "1"
countdown_seconds = 10

[[shell.session.actions]]
action = "suspend"
shortcut = "2"
enabled = false
countdown_seconds = 10

[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "hibernate"
command = "systemctl hibernate"
shortcut = "3"
enabled = false
countdown_seconds = 10

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 10

[[shell.session.actions]]
action = "logout"
shortcut = "5"
countdown_seconds = 10

[[shell.session.actions]]
action = "shutdown"
shortcut = "6"
countdown_seconds = 10

[[shell.session.actions]]
action = "reboot_uefi"
shortcut = "7"
countdown_seconds = 10

[system.monitor]
enabled = true

[dock]
enabled = true
auto_hide = true
icon_size = 40
reserve_space = false
show_dots = true

[desktop_widgets]
enabled = false

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = false

[hooks]

[nightlight]
enabled = false

[backdrop]
enabled = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[shell.screenshot]
annotate = true

# Lock-screen widget layout, as saved by the editor in Settings. The login box
# is placed for HDMI-A-4 at 1920x1080.
[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-4"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-4"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "HDMI-A-4"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-4".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = ["bhaswata/timeblock"]
auto_update = "official"

[[plugins.source]]
name = "nixcfg"
kind = "path"
location = "@pluginsDir@"
enabled = true
